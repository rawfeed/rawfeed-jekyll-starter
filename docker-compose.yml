services:
  jekyll:
    build: .
    container_name: rawfeed-jekyll
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      # Anonymous volumes preserve image-installed deps
      # (prevents host bind mount from shadowing them)
      - /site/node_modules
      - /site/.bundle-cache
    command: sh -c "npm install && npm run serve"
    stdin_open: true
    tty: true
